# Projet Xcode décrit en YAML : le .xcodeproj est généré par XcodeGen (sur le Mac de GitHub Actions).
# Pas besoin de Mac pour modifier le projet : on édite ce fichier et les sources Swift.
name: TrackGauge
options:
  bundleIdPrefix: fr.plmn
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: fr
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES

packages:
  OBDKit:
    path: Packages/OBDKit

targets:
  TrackGauge:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    dependencies:
      - package: OBDKit
      - target: TrackGaugeLiveActivity
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.plmn.trackgauge
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: TrackGauge
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        # Configuration éprouvée sur l'iPhone. La scène CarPlay (App/CarPlaySceneDelegate.swift) n'est PAS
        # déclarée tant que le droit Apple « driving task » n'est pas accordé : la déclarer dans une app SwiftUI
        # peut donner un écran vide. Pour l'activer le jour venu, voir l'en-tête de CarPlaySceneDelegate.swift.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIUserInterfaceStyle: Dark
        UIBackgroundModes:
          - audio
          - bluetooth-central
          - location
        NSBluetoothAlwaysUsageDescription: "TrackGauge se connecte à l'adaptateur OBD Bluetooth pour lire le turbo, le régime et les températures."
        NSLocationWhenInUseUsageDescription: "Le GPS garde la lecture OBD active quand l'iPhone est verrouillé ou que CarPlay est affiché, et donne la vitesse."
        NSLocationAlwaysAndWhenInUseUsageDescription: "Le GPS garde la lecture OBD active quand l'iPhone est verrouillé ou que CarPlay est affiché, et donne la vitesse."
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        ITSAppUsesNonExemptEncryption: false
    scheme:
      testTargets: []

  TrackGaugeLiveActivity:
    type: app-extension
    platform: iOS
    sources:
      - LiveActivity
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.plmn.trackgauge.LiveActivity
    info:
      path: LiveActivity/Info.plist
      properties:
        CFBundleDisplayName: TrackGauge
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
